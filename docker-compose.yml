services:
  cs2-control:
    build: .
    image: cs2-control-panel:latest
    container_name: cs2-control
    restart: unless-stopped
    ports:
      - "${PANEL_PORT:-3006}:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOST_CS2_DATA_PATH}:${CS2_DATA_PATH:-/cs2-data}
    environment:
      - AUTH_USER=${AUTH_USER}
      - AUTH_PASS=${AUTH_PASS}
      - CS2_CONTAINER=${CS2_CONTAINER}
      - RCON_HOST=${RCON_HOST}
      - RCON_PORT=${RCON_PORT:-27015}
      - RCON_PASSWORD=${RCON_PASSWORD}
      - CS2_DATA_PATH=${CS2_DATA_PATH:-/cs2-data}
      - PALWORLD_CONTAINER=${PALWORLD_CONTAINER:-palchaos-server}
      - PALWORLD_GAME_HOST_PATH=${PALWORLD_GAME_HOST_PATH:-/mnt/cache/appdata/palchaos-server/game}
      - PALWORLD_UPDATE_IMAGE=${PALWORLD_UPDATE_IMAGE:-ghcr.io/adam2893/palworld-proton-server:latest}
    labels:
      - net.unraid.docker.icon=http://${PANEL_HOST:-localhost}:${PANEL_PORT:-3006}/icons/icon.png
      - net.unraid.docker.webui=http://${PANEL_HOST:-localhost}:${PANEL_PORT:-3006}
      - net.unraid.docker.shell=sh
      - org.opencontainers.image.title=CS2 Control Panel
      - org.opencontainers.image.description=Lightweight web panel for kus/cs2-modded-server with RCON, map switching, macros, force update
